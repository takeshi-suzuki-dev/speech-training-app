spring.application.name=backend
azure.speech.key=${AZURE_SPEECH_KEY}
azure.speech.region=${AZURE_SPEECH_REGION}
elevenlabs.api-key=${ELEVENLABS_API_KEY}
elevenlabs.voice-id=CwhRBWXzGAHq8TQ4Fs17
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.nchiogoqeuhgfnnrdkpo
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=reference-audio
# Multipart upload limit for pronunciation audio
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Firebase Admin SDK service account JSON.
# Injected from Secrets Manager in production. Left blank locally so that
# GoogleCredentials falls back to the GOOGLE_APPLICATION_CREDENTIALS file path.
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}

# Comma-separated origins allowed to call /api/**.
# Browsers attach an Origin header to non-GET requests even when the request
# is same-origin, so the deployed frontend origin must be listed here too.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Supabase free-tier pooler caps session-mode clients at 15.
# Rolling deployments run the old and new task simultaneously, so each task
# stays well under that limit.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1