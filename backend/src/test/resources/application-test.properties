# In-memory database so the test suite never touches Supabase.
spring.datasource.url=jdbc:h2:mem:cadence;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none

app.cors.allowed-origins=http://localhost:3000
firebase.credentials-json=

# Blank so a test run never publishes to SNS, even if the environment has
# these set for local development.
app.access-request.topic-arn=
app.alert.topic-arn=
